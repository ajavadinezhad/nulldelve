<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Field supply models</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#131b18;color:#e0e8dc;font-family:Arial}canvas{position:absolute;inset:0;width:100%;height:100%}header{position:absolute;left:5%;top:7%;z-index:1}small{font:12px monospace;letter-spacing:3px;color:#8faca0}h1{font-size:30px;margin:9px 0}.caption{position:absolute;top:74%;width:50%;text-align:center;font-size:18px;font-weight:bold}.caption small{display:block;font-size:11px;letter-spacing:1px;margin-top:9px}.medical{left:50%}footer{position:absolute;left:5%;bottom:6%;font:12px Arial;color:#a1b6a7}</style></head><body><canvas id="view"></canvas><header><small>NULLDELVE · FIELD EQUIPMENT</small><h1>Grounded supply pickups</h1></header><div class="caption">AMMUNITION<small>OPEN CASE · SPARE MAGAZINES</small></div><div class="caption medical">MEDICAL SUPPLIES<small>CANVAS POUCH · STITCHED PATCH</small></div><footer>Shared in-game models · No floating rings or spinning boxes</footer><script type="module">
import * as THREE from '../../vendor/three.module.js';import{createLootView}from'../../loot-view.js';const scene=new THREE.Scene();scene.background=new THREE.Color('#131b18');const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#view'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.setSize(innerWidth,innerHeight);const camera=new THREE.OrthographicCamera();const h=2.25,ratio=innerWidth/innerHeight;Object.assign(camera,{left:-h*ratio/2,right:h*ratio/2,top:h/2,bottom:-h/2,near:.1,far:30});camera.position.set(0,5,4.8);camera.lookAt(0,.05,0);camera.updateProjectionMatrix();scene.add(new THREE.HemisphereLight(0xdce8d5,0x25382f,2));const sun=new THREE.DirectionalLight(0xffe5bc,3);sun.position.set(-2,4,3);sun.castShadow=true;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x253b30,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;floor.receiveShadow=true;scene.add(floor);const view=createLootView(scene);view.update({drops:[{id:'ammo-preview',kind:'ammo',x:-1.05,z:0},{id:'medical-preview',kind:'health',x:1.05,z:0}]},()=>true);renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
