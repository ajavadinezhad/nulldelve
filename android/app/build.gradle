plugins { id 'com.android.application' }

def privateSigning = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { privateSigning.load(it) }
def signingValue = { name -> System.getenv(name) ?: privateSigning.getProperty(name) }

android {
    namespace 'com.ajavadinezhad.nulldelve'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.ajavadinezhad.nulldelve'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.1.3'
    }
    signingConfigs {
        if (signingValue('NULLDELVE_KEYSTORE')) {
            release {
                storeFile file(signingValue('NULLDELVE_KEYSTORE'))
                storePassword signingValue('NULLDELVE_STORE_PASSWORD')
                keyAlias signingValue('NULLDELVE_KEY_ALIAS')
                keyPassword signingValue('NULLDELVE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingValue('NULLDELVE_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets')
}

// Package only runtime files. Never copy the repository, attachments or credentials.
tasks.register('syncGameAssets', Sync) {
    from('../..') {
        include 'index.html', 'puzzle-lab.html', 'privacy.html', 'account-deletion.html', 'backend-config.json'
        include 'src/**/*.js', 'styles/**/*.css', 'vendor/**/*.js', 'vendor/LICENSE'
        include 'assets/**/*.svg', 'assets/**/*.png', 'assets/**/*.jpg', 'assets/**/*.jpeg', 'assets/**/*.webp'
        include 'assets/**/*.gif', 'assets/**/*.mp3', 'assets/**/*.wav', 'assets/**/*.ogg', 'assets/**/*.woff', 'assets/**/*.woff2', 'assets/**/*.ttf'
        exclude 'assets/screenshots/**', 'assets/preview/**'
        exclude 'src/runtime-*.js', '**/*.test.*', '**/fixtures/**'
    }
    into layout.buildDirectory.dir('generated/gameAssets/game')
}
tasks.register('verifyReleaseSigning') {
    doLast {
        ['NULLDELVE_KEYSTORE', 'NULLDELVE_STORE_PASSWORD', 'NULLDELVE_KEY_ALIAS', 'NULLDELVE_KEY_PASSWORD'].each { name ->
            if (!signingValue(name)) throw new GradleException("Missing release signing setting: " + name)
        }
        if (!file(signingValue('NULLDELVE_KEYSTORE')).isFile()) throw new GradleException('Upload keystore file is unavailable')
    }
}
tasks.named('preBuild').configure { dependsOn 'syncGameAssets' }
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleaseSigning' }
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }
